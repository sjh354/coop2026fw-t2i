# scripts/judge.py --smoke-map 전용 매핑 — 스모크 테스트에서만 쓴다.
#
# bench_v1 이전에 생성된 파일럿 PNG(image-prompts/pilot-complex3-report.md 축별
# 판정표에서 그대로 가져옴, scripts/smoke_test_scoring.py와 동일한 6장)에는
# note frontmatter에 bench_v1 item_id를 역산할 근거(keyword_set: bench_v1)가 없다.
# 그래서 이 파일이 임시로 axes/expected를 부여한다 — 실제 채점 파이프라인에서는
# 쓰이지 않고, judge.py의 코드 경로(축별 판정 + JSON 파싱 + 재시도)를 pilot의
# 수동 판정 결과와 verdict 방향이 맞는지 확인하는 용도.
images:
  - path: image-prompts/v211_lumina2/images/v211_00_three_apples_in_a_basket.png

# dialect 방언: sd35-medium (CLIP + T5 혼합, 중간 길이 자연어 서술형)
# negative 필드 지원 모델 -> baseline = positive ∪ negative. 상세 규칙: README.md
base_experiment: educational-flat
model: sd35-medium
template: >-
  A flat educational vector illustration of {keyword}, textbook infographic
  style, limited flat color palette, crisp geometric shapes, thin clean
  outline, clear readable silhouette, single subject centered on a plain light background,
  no gradient, no shading, no photorealism.
negative: >-
  photorealistic, 3d render, photograph, gradient, soft shading, drop shadow,
  heavy black outline, painterly, textured, busy background, cluttered,
  text, letters, watermark, signature, grainy, noisy
transform_notes: >-
  태그 나열을 하나의 중간 길이 서술 문장으로 통합(pixart보다 짧고, sdxl보다 문법적으로
  완전함) — CLIP+T5 혼합 인코더 특성 반영. negative 필드는 shared와 동일 유지.

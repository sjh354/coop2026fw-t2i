# t2i-lab benchmark v1
# 40 prompts / easy 16, medium 16, hard 8 (40/40/20)
# categories: C1 사물단독(6) C2 역사문학(7) C3 자연과학(9) C4 생활사회(8) C5 감정관계(6) C6 개념은유(4)
# axes coverage: counting 8, spatial 13, attribute 10
# 제약: 텍스트 렌더링 요구 프롬프트 없음 (별도 트랙)

meta:
  version: v1
  total: 40
  difficulty_dist: {easy: 16, medium: 16, hard: 8}
  replaces: [basic30, history30]

prompts:
  # ---------- C1 사물 단독/소품 ----------

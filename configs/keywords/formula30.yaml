# 수식 텍스트 렌더링 벤치마크 키워드셋. 난이도 오름차순 (산수 -> 대수 -> 기하 -> 미적분 -> 과학).
# 평가: 문자 단위 정확 일치 여부. 대부분 모델은 뒤쪽 절반에서 실패 예상 -> 실패 지점이 모델 간 비교 기준.
# 프롬프트 조립 시 수식 문자열은 리라이터를 거치지 말고 그대로(verbatim) 전달할 것.
name: formula30
keywords:
  # --- 산수 (6) ---
  - "1 + 1 = 2"
  - "7 - 4 = 3"
  - "3 x 4 = 12"
  - "10 / 2 = 5"
  - "1/2 + 1/4 = 3/4"
  - "0.5 + 0.25 = 0.75"
  # --- 대수 (8) ---
  - "x + 5 = 12"
  - "2x - 3 = 7"
  - "y = 2x + 1"
  - "x^2 = 25"
  - "sqrt(144) = 12"
  - "2^5 = 32"
  - "a^2 + b^2 = c^2"
  - "(a + b)^2 = a^2 + 2ab + b^2"
  # --- 기하/삼각/로그 (6) ---
  - "A = pi r^2"
  - "C = 2 pi r"
  - "V = (4/3) pi r^3"
  - "sin^2 x + cos^2 x = 1"
  - "log 100 = 2"
  - "y = sin(x)"
  # --- 이차공식/미적분 (4) ---
  - "x = (-b +- sqrt(b^2 - 4ac)) / 2a"
  - "dy/dx = 2x"
  - "integral of x dx = x^2/2 + C"
  - "lim (x -> 0) sin(x)/x = 1"
  # --- 과학 공식 (6) ---
  - "E = mc^2"
  - "F = ma"
  - "V = IR"
  - "PV = nRT"
  - "H2O"
  - "E = hf"
